name: flutter_simple_ble
description: >-
  A lightweight Flutter plugin for Bluetooth Low Energy scanning, connections,
  service discovery, MTU handling, and characteristic writes on Android and iOS.
version: 1.0.0

homepage: https://github.com/wratheus/flutter_simple_ble
repository: https://github.com/wratheus/flutter_simple_ble
issue_tracker: https://github.com/wratheus/flutter_simple_ble/issues

topics:
  - bluetooth
  - ble
  - android
  - ios

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.github.wratheus.flutter_simple_ble
        pluginClass: FlutterSimpleBlePlugin
      ios:
        pluginClass: FlutterSimpleBlePlugin
